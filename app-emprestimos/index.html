<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Meus Empréstimos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de senha -->
  <section id="lock" class="lock" hidden>
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <h1>Meus Empréstimos</h1>
      <p id="lock-msg">Digite sua senha para entrar.</p>
      <form id="lock-form" autocomplete="off">
        <input type="password" id="lock-pass" placeholder="Senha" required autofocus>
        <input type="password" id="lock-pass2" placeholder="Confirme a senha" hidden>
        <p id="lock-error" class="error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="lock-btn">Entrar</button>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-back" hidden aria-label="Voltar">←</button>
      <h1 id="title">Painel</h1>
      <button class="icon-btn" id="btn-lock" aria-label="Bloquear" title="Bloquear">🔒</button>
    </header>

    <main id="view"></main>

    <nav class="bottomnav">
      <a href="#painel" data-nav="painel"><span>📊</span>Painel</a>
      <a href="#lista" data-nav="lista"><span>📋</span>Empréstimos</a>
      <a href="#novo" data-nav="novo" class="nav-add"><span>＋</span>Novo</a>
      <a href="#mensal" data-nav="mensal"><span>📅</span>Mensal</a>
      <a href="#config" data-nav="config"><span>⚙️</span>Dados</a>
    </nav>
  </div>

  <!-- Modal de pagamento -->
  <dialog id="pay-dialog">
    <form id="pay-form" method="dialog">
      <h2 id="pay-title">Registrar pagamento</h2>
      <label>Data
        <input type="date" id="pay-data" required>
      </label>
      <label>Valor (R$)
        <input type="text" inputmode="decimal" id="pay-valor" placeholder="0,00" required>
      </label>
      <label>Observação
        <input type="text" id="pay-obs" placeholder="Opcional">
      </label>
      <p id="pay-error" class="error" hidden></p>
      <div class="row-btns">
        <button type="button" class="btn" id="pay-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" value="ok">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Janela de confirmação -->
  <dialog id="ask-dialog">
    <p id="ask-msg"></p>
    <div class="row-btns" id="ask-btns"></div>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
